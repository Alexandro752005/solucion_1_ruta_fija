# PostgreSQL 16 nativo: servidor registrado en pgAdmin como CN_LOCAL.
# Activar con SPRING_PROFILES_ACTIVE=local; las claves se suministran por entorno.
# F1.2 separa la cuenta de aplicacion (DML) de la cuenta de Flyway (DDL).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/solucion_ruta_fija_1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.flyway.url=${SPRING_FLYWAY_URL}
spring.flyway.user=${SPRING_FLYWAY_USERNAME}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD}
app.seed.enabled=false

# Piloto OTP Gmail. Las credenciales llegan solo del archivo privado local.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.otp.email.allowed-sender=rutafija.dev1@gmail.com
app.otp.email.allowed-recipients=${APP_OTP_EMAIL_ALLOWED_RECIPIENTS:sandrito10xyz@gmail.com}
