name: Ruta Fija CI nativa

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-native-postgresql:
    name: Backend verify with native PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Install and start PostgreSQL 16 natively
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16 postgresql-client-16
          sudo pg_ctlcluster 16 main start
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres -c "select version();"

      - name: Provision isolated integration database
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $migratorPassword = [Guid]::NewGuid().ToString('N')
          $appPassword = [Guid]::NewGuid().ToString('N')
          $testPassword = [Guid]::NewGuid().ToString('N')
          Write-Output ('::add-mask::' + $migratorPassword)
          Write-Output ('::add-mask::' + $appPassword)
          Write-Output ('::add-mask::' + $testPassword)

          $rolesSql = @"
          SET password_encryption = 'scram-sha-256';
          CREATE ROLE rf_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS PASSWORD '$migratorPassword';
          CREATE ROLE rf_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS PASSWORD '$appPassword';
          CREATE ROLE rf_test LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS PASSWORD '$testPassword';
          "@
          $rolesSql | & sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres
          if ($LASTEXITCODE -ne 0) { throw 'No se pudieron crear roles efímeros de CI.' }

          & sudo -u postgres createdb -O rf_migrator ruta_fija_test
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo crear ruta_fija_test efímera.' }

          $databaseSql = @"
          ALTER DATABASE ruta_fija_test SET TimeZone TO 'UTC';
          REVOKE ALL ON DATABASE ruta_fija_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE ruta_fija_test TO rf_migrator, rf_test;
          ALTER SCHEMA public OWNER TO rf_migrator;
          REVOKE ALL ON SCHEMA public FROM PUBLIC, rf_app;
          GRANT USAGE, CREATE ON SCHEMA public TO rf_migrator;
          GRANT USAGE ON SCHEMA public TO rf_test;
          ALTER DEFAULT PRIVILEGES FOR ROLE rf_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rf_test;
          ALTER DEFAULT PRIVILEGES FOR ROLE rf_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO rf_test;
          "@
          $databaseSql | & sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d ruta_fija_test
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo aislar ruta_fija_test en CI.' }

          # These regression suites deliberately refuse the historical harness.
          # Only fresh GitHub-hosted runner databases are provisioned here.
          foreach ($database in @('rf_legacy_qa_20261023', 'rf_legacy_concurrency_qa_20261023', 'rf_identity_correction_qa_20261023')) {
            & sudo -u postgres createdb -O rf_migrator $database
            if ($LASTEXITCODE -ne 0) { throw "No se pudo crear la base dedicada $database." }
            $dedicatedSql = @"
          ALTER DATABASE $database SET TimeZone TO 'UTC';
          REVOKE ALL ON DATABASE $database FROM PUBLIC;
          GRANT CONNECT ON DATABASE $database TO rf_migrator, rf_app;
          ALTER SCHEMA public OWNER TO rf_migrator;
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          GRANT USAGE, CREATE ON SCHEMA public TO rf_migrator;
          GRANT USAGE ON SCHEMA public TO rf_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rf_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rf_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rf_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO rf_app;
          "@
            $dedicatedSql | & sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d $database
            if ($LASTEXITCODE -ne 0) { throw "No se pudieron aislar los permisos de $database." }
          }

          @(
            'RF_TEST_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:5432/ruta_fija_test',
            'RF_TEST_DATASOURCE_USERNAME=rf_test',
            "RF_TEST_DATASOURCE_PASSWORD=$testPassword",
            'RF_TEST_MIGRATOR_URL=jdbc:postgresql://127.0.0.1:5432/ruta_fija_test',
            'RF_TEST_MIGRATOR_USERNAME=rf_migrator',
            "RF_TEST_MIGRATOR_PASSWORD=$migratorPassword",
            'RF_LEGACY_QA_URL=jdbc:postgresql://127.0.0.1:5432/rf_legacy_qa_20261023',
            'RF_LEGACY_CONCURRENCY_QA_URL=jdbc:postgresql://127.0.0.1:5432/rf_legacy_concurrency_qa_20261023',
            'RF_IDENTITY_CORRECTION_QA_URL=jdbc:postgresql://127.0.0.1:5432/rf_identity_correction_qa_20261023',
            "RF_LEGACY_QA_APP_PASSWORD=$appPassword",
            "RF_LEGACY_QA_MIGRATOR_PASSWORD=$migratorPassword"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Verify candidate units and isolated conductor regressions
        working-directory: backend
        shell: bash
        run: |
          unit_classes="$(python3 ../scripts/ci/backend_candidate_checks.py units)"
          ./mvnw --batch-mode --no-transfer-progress \
            "-Dtest=$unit_classes" \
            '-Dit.test=LegacyConductorReconciliationIT,LegacyConductorRegularizationConcurrencyIT,DriverIdentityReviewCorrectionIT' \
            verify

      - name: Reject missing, failed or skipped selected tests
        shell: bash
        run: python3 scripts/ci/backend_candidate_checks.py reports

  frontend:
    name: Frontend verify (Node 24.16)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24.16
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Type-check frontend
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test:ci

      - name: Build production frontend
        run: npm run build

  mobile:
    name: Mobile analyze and test (Flutter 3.47.5)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze mobile source
        run: flutter analyze --no-pub

      - name: Test mobile
        run: flutter test --no-pub
