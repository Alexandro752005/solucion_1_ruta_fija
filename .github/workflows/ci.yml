name: Ruta Fija CI nativa

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-native-postgresql:
    name: Backend verify with native PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Install and start PostgreSQL 16 natively
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16 postgresql-client-16
          sudo pg_ctlcluster 16 main start
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres -c "select version();"

      - name: Provision isolated integration database
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $migratorPassword = [Guid]::NewGuid().ToString('N')
          $appPassword = [Guid]::NewGuid().ToString('N')
          $testPassword = [Guid]::NewGuid().ToString('N')

          $rolesSql = @"
          SET password_encryption = 'scram-sha-256';
          CREATE ROLE rf_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS PASSWORD '$migratorPassword';
          CREATE ROLE rf_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS PASSWORD '$appPassword';
          CREATE ROLE rf_test LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS PASSWORD '$testPassword';
          "@
          $rolesSql | & sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres
          if ($LASTEXITCODE -ne 0) { throw 'No se pudieron crear roles efímeros de CI.' }

          & sudo -u postgres createdb -O rf_migrator ruta_fija_test
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo crear ruta_fija_test efímera.' }

          $databaseSql = @"
          ALTER DATABASE ruta_fija_test SET TimeZone TO 'UTC';
          REVOKE ALL ON DATABASE ruta_fija_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE ruta_fija_test TO rf_migrator, rf_test;
          ALTER SCHEMA public OWNER TO rf_migrator;
          REVOKE ALL ON SCHEMA public FROM PUBLIC, rf_app;
          GRANT USAGE, CREATE ON SCHEMA public TO rf_migrator;
          GRANT USAGE ON SCHEMA public TO rf_test;
          "@
          $databaseSql | & sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d ruta_fija_test
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo aislar ruta_fija_test en CI.' }

          @(
            'RF_TEST_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:5432/ruta_fija_test',
            'RF_TEST_DATASOURCE_USERNAME=rf_test',
            "RF_TEST_DATASOURCE_PASSWORD=$testPassword",
            'RF_TEST_MIGRATOR_URL=jdbc:postgresql://127.0.0.1:5432/ruta_fija_test',
            'RF_TEST_MIGRATOR_USERNAME=rf_migrator',
            "RF_TEST_MIGRATOR_PASSWORD=$migratorPassword"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Verify backend
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Reject omitted critical integration tests
        working-directory: backend
        shell: bash
        run: |
          summary="target/failsafe-reports/failsafe-summary.xml"
          test -f "$summary"
          if grep -Eq '<skipped>[1-9][0-9]*</skipped>' "$summary"; then
            echo "Critical integration tests were skipped"
            exit 1
          fi

  frontend:
    name: Frontend verify (Node 24.16)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.16
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Lint frontend when configured
        run: npm run lint --if-present

      - name: Run frontend tests
        run: npm run test:ci

      - name: Build production frontend
        run: npm run build
