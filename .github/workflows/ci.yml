name: Ruta Fija CI — Phase 4

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-validation:
    name: Validate Compose and images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Provide non-production validation values
        run: cp .env.example .env

      - name: Validate Compose model
        run: docker compose --profile app config --quiet

      - name: Build application images
        run: docker compose --profile app build backend frontend

  backend:
    name: Backend verify (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Require Docker for PostgreSQL integration tests
        run: docker info

      - name: Verify backend
        working-directory: backend
        run: bash ./mvnw -B --no-transfer-progress verify

      - name: Reject omitted critical integration tests
        working-directory: backend
        shell: bash
        run: |
          summary="target/failsafe-reports/failsafe-summary.xml"
          test -f "$summary"
          if grep -Eq '<skipped>[1-9][0-9]*</skipped>' "$summary"; then
            echo "Critical integration tests were skipped"
            exit 1
          fi

  frontend:
    name: Frontend verify (Node 24.16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.16
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Lint frontend when configured
        run: npm run lint --if-present

      - name: Run frontend tests
        run: npm run test:ci

      - name: Build production frontend
        run: npm run build
